[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-loom"
version = "0.1.0"
description = "Local vocal harmonizer and MIDI pitch correction for recorded singing. Create tuned solos, duets and four-voice stacks with a Windows GUI and Python CLI. Inspired by Imogen Heap's Hide and Seek."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "jordankzf"}]
keywords = ["vocal-harmonizer", "pitch-correction", "vocal-processing", "midi", "vocal-harmony", "music-production", "audio-editing", "psola", "world-vocoder"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "sounddevice==0.5.6",
  "soundfile==0.14.0",
  "mido==1.3.3",
  "python-rtmidi==1.5.8",
  "pedalboard==0.9.26",
  "pyworld==0.3.5",
  "praat-parselmouth==0.4.7",
  "pyloudnorm==0.2.0",
  "faster-whisper==1.2.1",
]

[project.scripts]
vocal-loom = "vocal_pipeline:main"
vocal-pipeline = "vocal_pipeline:main"

[project.gui-scripts]
vocal-loom-ui = "pipeline_ui:main"
vocal-pipeline-ui = "pipeline_ui:main"

[tool.setuptools]
py-modules = [
  "vocal_pipeline", "pipeline_ui", "pipeline_midi", "pipeline_alignment",
  "pipeline_cleanup", "pipeline_comp", "pipeline_transcript", "pipeline_dsp",
  "arrangement", "duet_part",
]

[project.optional-dependencies]
demo = ["Pillow>=11,<14"]
