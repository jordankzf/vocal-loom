name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install ".[demo]"
      - name: Test offline processing
        run: python -m unittest discover -p "test_*.py" -v
      - name: Check release metadata and approved files
        run: python scripts/check_release.py
